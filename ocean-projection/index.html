<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocean — Combined Projection</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #panel { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: calc(100vw - 32px); padding: 8px; background: #111; color: #fff; border: 1px solid #777; font: 13px/1.6 sans-serif; }
    #panel select, #panel button { margin: 2px; }
    #status { max-width: 520px; white-space: pre-wrap; }
    #status.error { color: #ffaaaa; }
  </style>
</head>
<body>
  <div id="panel">
    <div>OCEAN · 统一投影入口</div>
    <div>
      <label>显示：<select id="surface"><option value="all">全部投影面</option></select></label>
      <label>Yuki 鱼群：<select id="variant"><option value="white">白色鱼群（Sketch 3）</option><option value="color">彩色鱼群（Sketch 2）</option></select></label>
    </div>
    <div>
      <button id="calibrate" disabled>校准 C</button>
      <button id="test" disabled>测试图 T</button>
      <button id="save" disabled>保存 S</button>
      <button id="load" disabled>加载 L</button>
      <button id="fullscreen">全屏 F</button>
      <button id="pause" disabled>暂停 Space</button>
      <button id="hide">隐藏 H</button>
    </div>
    <div>0 显示全部 · 1–9 单独查看 · R 重排预览（只改布局）</div>
    <div id="status">正在启动并加载图片…</div>
    <input id="map-file" type="file" accept=".json,application/json" hidden>
  </div>

  <!-- These libraries are bundled locally: no CDN required. -->
  <script src="vendor/p5.js"></script>
  <script src="vendor/p5.mapper.min.js"></script>
  <script src="scenes/nora.js"></script>
  <script src="scenes/hanni.js"></script>
  <script src="scenes/yuki-fishbone.js"></script>
  <script src="scenes/yuki-ocean-color.js"></script>
  <script src="scenes/yuki-ocean-white.js"></script>
  <script src="main.js"></script>
</body>
</html>
